<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Brand - Gummies</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcf8f8;
        }

        header {
            background-color: #FF788D;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            display: block;
        }

        .logo-text {
            color: #1f1818;
            font-weight: bold;
            font-size: 24px;
            margin-left: 10px;
        }

        /* Hamburger Button (Hidden on Desktop) */
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 32px;
            color: #1f1818;
            cursor: pointer;
            padding: 0;
        }

        /* Desktop Navigation */
        nav {
            margin-left: auto;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #f8f8f8;
        }

        .product-menu {
            border: none;
            background-color: #FF788D;
            color: black;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            font-size: 16px;
        }

        .product-menu:hover {
            background-color: #f8f8f8;
            color: #FF788D;
        }

        /* Hero Banner */
        .hero {
            background-color: #FFB347;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: clamp(28px, 5vw, 36px);
        }

        .hero p {
            margin: 0;
            font-size: clamp(14px, 3vw, 18px);
        }

        /* Product Grid */
        .products-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 280px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            margin: 15px 0 10px 0;
            color: #333;
        }

        .card p {
            color: #666;
            font-size: 14px;
            margin: 0 0 10px 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #FF788D;
            margin: 10px 0;
        }

        .btn {
            background-color: #FF788D;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #e06377;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            display: inline-block;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        /* Mobile Styles (Screen width <= 768px) */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #FF788D;
                padding: 15px 20px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                z-index: 100;
            }

            nav.active {
                display: block;
            }

            nav ul {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .product-menu {
                width: 100%;
                text-align: left;
                padding: 0;
            }

            .products-container {
                padding: 0 15px;
                margin: 20px auto;
            }

            .card {
                width: 100%;
                max-width: 340px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <div class="logo">
                <img src="candy logo.avif" alt="Candy Brand Logo">
            </div>
            <span class="logo-text">Candy Brand</span>
        </div>

        <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li>
                    <select name="product" id="product" class="product-menu" onchange="if (this.value) window.location.href = this.value;">
                        <option value="gummies.html" selected>Gummies</option>
                        <option value="products.html">All Products</option>
                        <option value="chocolate.html">Chocolate</option>
                        <option value="lollipops.html">Lollipops</option>
                    </select>
                </li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero">
        <h1>Juicy Gummy Treats</h1>
        <p>Soft, chewy, and bursting with real fruit flavors.</p>
    </div>

    <main class="products-container">
        <div class="card">
            <img src="gummy-bears.jpg" alt="Gummy Bears">
            <h3>Fruity Gummy Bears</h3>
            <p>Assorted fruit flavors in every pack.</p>
            <div class="price">$2.99</div>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="sour-worms.jpg" alt="Sour Worms">
            <h3>Sour Worms</h3>
            <p>Tangy sour coating with sweet gummy center.</p>
            <div class="price">$3.29</div>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="peach-rings.jpg" alt="Peach Rings">
            <h3>Peach Rings</h3>
            <p>Sweet peach-flavored chewy rings.</p>
            <div class="price">$2.99</div>
            <button class="btn">Add to Cart</button>
        </div>
    </main>

    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');

        hamburgerBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    </script>
</body>

</html>
